<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IPAS CritiQuest</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background-color: #f8fafc; color: #1e293b; display: flex; flex-direction: column; min-height: 100vh; }
    header { background-color: #4338ca; color: white; padding: 1rem; display: flex; justify-content: space-between; align-items: center; }
    .container { max-width: 1000px; margin: 0 auto; padding: 1.5rem; width: 100%; display: grid; grid-template-columns: 1fr; gap: 1.5rem; }
    @media (min-width: 768px) { .container { grid-template-columns: 1fr 2fr; } }
    .card { background: white; padding: 1.25rem; border-radius: 0.75rem; border: 1px solid #e2e8f0; box-shadow: 0 1px 2px rgba(0,0,0,0.05); }
    .btn { background: #4338ca; color: white; border: none; padding: 0.6rem 1rem; border-radius: 0.5rem; font-weight: 600; cursor: pointer; font-size: 0.875rem; }
    .btn:hover { background: #3730a3; }
    .btn-mic { background: #059669; }
    .btn-mic.recording { background: #dc2626; animation: pulse 1.5s infinite; }
    .btn-clear { background: #e2e8f0; color: #475569; }
    .case-btn { width: 100%; text-align: left; padding: 0.75rem; border: 1px solid #e2e8f0; border-radius: 0.5rem; background: white; margin-bottom: 0.5rem; cursor: pointer; }
    .case-btn.active { border-color: #4338ca; background: #eef2ff; }
    textarea { width: 100%; padding: 0.75rem; border: 1px solid #cbd5e1; border-radius: 0.5rem; font-size: 0.9rem; margin: 1rem 0; resize: vertical; }
    .flex-between { display: flex; justify-content: space-between; align-items: center; gap: 0.5rem; flex-wrap: wrap; }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
  </style>
</head>
<body>

  <header>
    <h2>🧪 IPAS CritiQuest</h2>
    <button class="btn" onclick="shareApp()">Bagikan Link</button>
  </header>

  <div class="container">
    <!-- Sidebar -->
    <div class="card">
      <h3 style="margin-bottom: 1rem;">Pilih Studi Kasus</h3>
      <button class="case-btn active" id="btn-pencemaran" onclick="selectCase('pencemaran')">
        <strong>1. Pencemaran Sungai</strong><br>
        <small style="color: #64748b;">Dampak limbah ekosistem air.</small>
      </button>
      <button class="case-btn" id="btn-energi" onclick="selectCase('energi')">
        <strong>2. Krisis Energi Desa</strong><br>
        <small style="color: #64748b;">Solusi energi terbarukan.</small>
      </button>
      <button class="case-btn" id="btn-sampah" onclick="selectCase('sampah')">
        <strong>3. Pengelolaan Sampah</strong><br>
        <small style="color: #64748b;">Daur ulang limbah plastik.</small>
      </button>
    </div>

    <!-- Main Workspace -->
    <div style="display: flex; flex-direction: column; gap: 1.5rem;">
      <div class="card">
        <span style="background: #e0e7ff; color: #3730a3; padding: 0.2rem 0.6rem; border-radius: 1rem; font-size: 0.75rem; font-weight: bold;">STUDI KASUS</span>
        <h3 id="case-title" style="margin-top: 0.5rem;">Pencemaran Sungai</h3>
        <p id="case-desc" style="margin-top: 0.5rem; color: #475569; font-size: 0.95rem; line-height: 1.5;"></p>
      </div>

      <div class="card">
        <h3>Jawaban & Solusi Siswa</h3>
        <textarea id="student-answer" rows="6" placeholder="Ketik jawaban di sini atau tekan tombol Dikte Suara (Mic) untuk berbicara..."></textarea>
        
        <div class="flex-between">
          <div style="display: flex; gap: 0.5rem;">
            <button class="btn btn-mic" id="mic-btn" onclick="toggleMic()">🎤 Dikte Suara (Mic)</button>
            <button class="btn btn-clear" onclick="clearAnswer()">Bersihkan</button>
          </div>
          <button class="btn" onclick="submitAnswer()">Kirim Jawaban</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    const cases = {
      pencemaran: {
        title: "Studi Kasus 1: Pencemaran Sungai Akibat Limbah",
        desc: "Sebuah sungai di dekat pemukiman keruh dan berbau akibat limbah industri. Banyak ikan mati dan warga kesulitan air bersih. Analisis penyebabnya dan berikan solusi teknologi sederhana untuk menyaring air tersebut!"
      },
      energi: {
        title: "Studi Kasus 2: Krisis Energi Listrik Desa",
        desc: "Desa terpencil belum terjangkau listrik, namun memiliki sungai deras dan cahaya matahari melimpah. Rancang rencana pembangkit listrik ramah lingkungan yang cocok untuk desa tersebut!"
      },
      sampah: {
        title: "Studi Kasus 3: Penumpukan Sampah Plastik",
        desc: "Kantin sekolah menghasilkan banyak sampah plastik sekali pakai setiap hari. Susun rencana pengelolaan sampah (3R) dan ide produk daur ulang yang bernilai ekonomis!"
      }
    };

    let selectedKey = 'pencemaran';
    let recognition;
    let isRecording = false;

    window.onload = function() {
      const urlParams = new URLSearchParams(window.location.search);
      const caseParam = urlParams.get('case');
      selectCase(caseParam && cases[caseParam] ? caseParam : 'pencemaran');
      initMic();
    };

    function selectCase(key) {
      selectedKey = key;
      document.getElementById('case-title').innerText = cases[key].title;
      document.getElementById('case-desc').innerText = cases[key].desc;
      
      document.querySelectorAll('.case-btn').forEach(btn => btn.classList.remove('active'));
      document.getElementById(`btn-${key}`).classList.add('active');
    }

    function initMic() {
      if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        recognition = new SpeechRecognition();
        recognition.continuous = true;
        recognition.lang = 'id-ID';

        recognition.onresult = function(e) {
          const text = e.results[e.results.length - 1][0].transcript;
          const input = document.getElementById('student-answer');
          input.value += (input.value ? ' ' : '') + text;
        };

        recognition.onerror = function() { stopMic(); };
        recognition.onend = function() { stopMic(); };
      } else {
        const btn = document.getElementById('mic-btn');
        btn.disabled = true;
        btn.innerText = "Mic Tidak Didukung";
      }
    }

    function toggleMic() {
      if (!recognition) return alert("Browser tidak mendukung Dikte Suara.");
      if (isRecording) {
        recognition.stop();
        stopMic();
      } else {
        recognition.start();
        isRecording = true;
        const btn = document.getElementById('mic-btn');
        btn.classList.add('recording');
        btn.innerText = "🛑 Hentikan Rekam";
      }
    }

    function stopMic() {
      isRecording = false;
      const btn = document.getElementById('mic-btn');
      btn.classList.remove('recording');
      btn.innerText = "🎤 Dikte Suara (Mic)";
    }

    function clearAnswer() {
      document.getElementById('student-answer').value = '';
    }

    function submitAnswer() {
      if (!document.getElementById('student-answer').value.trim()) {
        return alert("Harap isi jawaban terlebih dahulu.");
      }
      alert("Jawaban berhasil dikirim!");
    }

    function shareApp() {
      const url = window.location.href.split('?')[0] + '?case=' + selectedKey;
      navigator.clipboard.writeText(url);
      alert("Link berhasil disalin ke clipboard! Bagikan ke siswa via WhatsApp/Classroom:\n\n" + url);
    }
  </script>
</body>
</html>
